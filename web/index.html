  <!-- Zero-dependency, no build step. Load order matters: i18n/api/ui define the
       primitives the shell and every view build on. The views call
       window.Views.register(...) as they execute; app.js (loaded last) takes
       the registry over. -->
  <script>
    (function () {
      var pending = [];
      window.Views = {
        pending: pending,
        register: function (name, view) { pending.push([name, view]); },
      };
    })();
  </script>
